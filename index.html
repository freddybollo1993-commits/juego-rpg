<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RPG Medieval de Supervivencia Móvil - Clanes &amp; Terraformación</title>
  <meta name="description" content="RPG Medieval de Supervivencia Móvil con sistema de adquisición de habilidades tribales, objetos especiales efímeros, mundo regional autónomo y combate contra la entidad extraterrestre.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#d4af37">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <div id="app-container">
    <canvas id="game-canvas"></canvas>

    <!-- ── D-Pad isométrico 8 direcciones (esquina inferior izquierda) ── -->
    <div id="touch-controls-left" class="touch-controls-left">
      <div class="iso-dpad" id="iso-dpad">
        <!-- 3x3: TL=N(-1,-1) TC=NW(-1,0) TR=NE(0,-1)
                  ML=W(-1,+1) MC=⏳       MR=E(+1,-1)
                  BL=SW(0,+1) BC=SE(+1,0) BR=S(+1,+1) -->
        <button class="iso-btn iso-btn-n"    id="btn-iso-n"    title="Norte (-1,-1)">⬆</button>
        <button class="iso-btn iso-btn-nw"   id="btn-iso-nw"   title="Noroeste (-1,0)">↖</button>
        <button class="iso-btn iso-btn-ne"   id="btn-iso-ne"   title="Noreste (0,-1)">↗</button>
        <button class="iso-btn iso-btn-w"    id="btn-iso-w"    title="Oeste (-1,+1)">⬅</button>
        <button class="iso-btn iso-btn-wait" id="btn-iso-wait" title="Esperar turno">⏳</button>
        <button class="iso-btn iso-btn-e"    id="btn-iso-e"    title="Este (+1,-1)">➡</button>
        <button class="iso-btn iso-btn-sw"   id="btn-iso-sw"   title="Suroeste (0,+1)">↙</button>
        <button class="iso-btn iso-btn-se"   id="btn-iso-se"   title="Sureste (+1,0)">↘</button>
        <button class="iso-btn iso-btn-s"    id="btn-iso-s"    title="Sur (+1,+1)">⬇</button>
      </div>
    </div>

    <!-- ── FAB único de configuración (esquina superior derecha) ── -->
    <button class="settings-fab" id="btn-settings" title="Configuración y opciones">⚙️</button>

    <!-- ── Panel de configuración desplegable ── -->
    <div class="settings-panel" id="settings-panel" aria-hidden="true">
      <div class="settings-panel-inner">

        <div class="settings-section-title">🖥️ Pantalla</div>
        <div class="settings-row">
          <button class="settings-btn" id="btn-toggle-frame">📱 Pantalla completa / Normal</button>
          <button class="settings-btn" id="btn-toggle-dpad">🕹️ Mostrar / Ocultar controles</button>
          <button class="settings-btn" id="btn-mute">🔊 Audio: On</button>
        </div>

        <div class="settings-divider"></div>
        <div class="settings-section-title">🗺️ Navegación</div>
        <div class="settings-row">
          <button class="settings-btn" id="btn-world-map">🗺️ Mapa del Mundo</button>
          <button class="settings-btn" id="btn-talents">🧬 Árbol de Talentos</button>
        </div>

        <div class="settings-divider"></div>
        <div class="settings-section-title">🧪 Sandbox de Prueba</div>
        <div class="settings-row">
          <button class="settings-btn" id="btn-test-world">🧪 Abrir Mundo de Prueba</button>
          <button class="settings-btn settings-btn-danger" id="btn-reset-game">🔄 Reiniciar Partida</button>
        </div>

      </div>
    </div>

  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
