<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Isla Desconocida - RPG de Supervivencia por Turnos</title>
  <meta name="description" content="RPG de supervivencia y exploración por turnos en una isla desconocida: cada acción consume tiempo, la oscuridad avanza y cada bioma es un grupo de mapas por descubrir.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#d4af37">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <div id="app-container">
    <canvas id="game-canvas"></canvas>

    <!-- ── D-Pad de 8 direcciones (esquina inferior izquierda) ── -->
    <div id="touch-controls-left" class="touch-controls-left">
      <div class="dpad" id="dpad">
        <button class="dpad-btn" id="btn-dpad-ul"    title="Arriba-izquierda">↖</button>
        <button class="dpad-btn" id="btn-dpad-up"    title="Arriba">⬆</button>
        <button class="dpad-btn" id="btn-dpad-ur"    title="Arriba-derecha">↗</button>
        <button class="dpad-btn" id="btn-dpad-left"  title="Izquierda">⬅</button>
        <button class="dpad-btn dpad-wait" id="btn-dpad-wait" title="Esperar turno">⏳</button>
        <button class="dpad-btn" id="btn-dpad-right" title="Derecha">➡</button>
        <button class="dpad-btn" id="btn-dpad-dl"    title="Abajo-izquierda">↙</button>
        <button class="dpad-btn" id="btn-dpad-down"  title="Abajo">⬇</button>
        <button class="dpad-btn" id="btn-dpad-dr"    title="Abajo-derecha">↘</button>
      </div>
    </div>

    <!-- ── FAB único de configuración (esquina superior derecha) ── -->
    <button class="settings-fab" id="btn-settings" title="Configuración y opciones">⚙️</button>

    <!-- ── Zoom y centrado de la cámara (bajo el botón de configuración) ── -->
    <div class="camera-controls" id="camera-controls">
      <button class="camera-btn" id="btn-zoom-in" title="Acercar">＋</button>
      <button class="camera-btn" id="btn-zoom-out" title="Alejar">－</button>
      <button class="camera-btn" id="btn-recenter" title="Centrar en el personaje">🎯</button>
    </div>

    <!-- ── Panel de configuración desplegable ── -->
    <div class="settings-panel" id="settings-panel" aria-hidden="true">
      <div class="settings-panel-inner">

        <div class="settings-section-title">🖥️ Pantalla</div>
        <div class="settings-row">
          <button class="settings-btn" id="btn-toggle-frame">📱 Pantalla completa / Normal</button>
          <button class="settings-btn" id="btn-toggle-dpad">🕹️ Mostrar / Ocultar controles</button>
          <button class="settings-btn" id="btn-mute">🔊 Audio: On</button>
        </div>

        <div class="settings-divider"></div>
        <div class="settings-section-title">💾 Partida</div>
        <div class="settings-row">
          <button class="settings-btn settings-btn-danger" id="btn-reset-game">🔄 Reiniciar Partida</button>
        </div>

      </div>
    </div>

  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
