<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RPG Medieval de Supervivencia Móvil - Clanes & Terraformación</title>
  <meta name="description" content="RPG Medieval de Supervivencia Móvil con sistema de adquisición de habilidades tribales, objetos especiales efímeros, mundo regional autónomo y combate contra la entidad extraterrestre.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#d4af37">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <div id="app-container">
    <canvas id="game-canvas"></canvas>

    <!-- Dedicated Touch Zone with 2.5D Isometric D-Pad (Left Side of Screen) -->
    <div id="touch-controls-left" class="touch-controls-left">
      <div class="iso-dpad" id="iso-dpad">
        <button class="iso-btn iso-btn-nw" id="btn-iso-nw" title="Moverse al Noroeste (↖)">↖</button>
        <button class="iso-btn iso-btn-ne" id="btn-iso-ne" title="Moverse al Noreste (↗)">↗</button>
        <button class="iso-btn iso-btn-wait" id="btn-iso-wait" title="Esperar / Descansar Turno (⏳)">⏳</button>
        <button class="iso-btn iso-btn-sw" id="btn-iso-sw" title="Moverse al Suroeste (↙)">↙</button>
        <button class="iso-btn iso-btn-se" id="btn-iso-se" title="Moverse al Sureste (↘)">↘</button>
      </div>
    </div>

    <!-- Top Status Bar Controls -->
    <div class="top-controls">
      <button class="icon-btn btn-world-map" id="btn-world-map" title="Cartografía 2.5D de los 7 Biomas">🗺️ Mapa 2.5D</button>
      <button class="icon-btn btn-talents" id="btn-talents" title="Árbol de Talentos y Maestría Tribal">🧬 Talentos</button>
      <button class="icon-btn btn-test-world" id="btn-test-world" title="Abrir Mundo de Prueba & Galería de Arte">🧪 Mundo de Prueba</button>
      <button class="icon-btn" id="btn-reset-game" title="Reiniciar Partida y Limpiar Guardado">🔄 Reiniciar</button>
      <button class="icon-btn" id="btn-toggle-frame" title="Alternar Vista Móvil / Pantalla Completa">📱 Móvil/PC</button>
      <button class="icon-btn" id="btn-mute" title="Activar/Desactivar Sonido">🔊 Audio</button>
    </div>

    <!-- On-Screen Mobile Thumb Buttons (Right Side of Screen) -->
    <div class="mobile-touch-bar">
      <!-- Upper row: Utilities -->
      <div class="touch-row">
        <button class="touch-action-btn" id="btn-touch-inv" title="Inventario y Relicario">
          <span>🎒</span>
          <span class="label">Mochila</span>
        </button>
        <button class="touch-action-btn" id="btn-touch-codex" title="Códice Tribal">
          <span>📖</span>
          <span class="label">Códice</span>
        </button>
        <button class="touch-action-btn btn-radial" id="btn-touch-radial" title="Rueda Radial">
          <span>☸️</span>
          <span class="label">Radial</span>
        </button>
        <button class="touch-action-btn btn-bow" id="btn-touch-bow" title="Disparar Arco Tribal (Flechas de Sílex, Fuego y Escarcha)">
          <span>🏹</span>
          <span class="label">Arco</span>
        </button>
      </div>

      <!-- Lower row: Combat & Actions -->
      <div class="touch-row">
        <button class="touch-action-btn btn-map" id="btn-touch-map" title="Cartografía 2.5D de los 7 Biomas">
          <span>🗺️</span>
          <span class="label">Mapa</span>
        </button>
        <button class="touch-action-btn btn-wait" id="btn-touch-wait" title="Esperar / Descansar Turno (Recupera Estamina)">
          <span>⏳</span>
          <span class="label">Descanso</span>
        </button>
        <button class="touch-action-btn btn-sacrifice" id="btn-touch-sacrifice" title="Detonar Sacrificio">
          <span>💥</span>
          <span class="label">Sacrificio</span>
        </button>
        <button class="touch-action-btn btn-attack" id="btn-touch-attack" title="Atacar Enemigo Adyacente / Recolectar">
          <span>⚔️</span>
          <span class="label">Golpe</span>
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
