<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#334155" />
      <stop offset="70%" stop-color="#475569" />
      <stop offset="100%" stop-color="#b0a880" />
    </linearGradient>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="sandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="1200" height="350" fill="url(#skyGrad)" />

  <!-- Sun Glow -->
  <circle cx="950" cy="220" r="90" fill="#fde047" opacity="0.4" filter="blur(10px)" />
  <circle cx="950" cy="220" r="45" fill="#fff" opacity="0.9" />

  <!-- Distant Ocean -->
  <rect y="320" width="1200" height="150" fill="url(#oceanGrad)" />

  <!-- Shoreline Wave Foam -->
  <path d="M0,450 Q300,430 600,460 T1200,440 L1200,480 L0,480 Z" fill="#e0f2fe" opacity="0.6" />
  <path d="M0,465 Q350,450 700,475 T1200,460 L1200,500 L0,500 Z" fill="#bae6fd" opacity="0.4" />

  <!-- Golden Sand Beach -->
  <path d="M0,470 Q400,450 800,490 T1200,470 L1200,675 L0,675 Z" fill="url(#sandGrad)" />

  <!-- Jagged Basalt Rocks (Reef) -->
  <polygon points="100,580 160,460 240,620" fill="#1e293b" />
  <polygon points="180,600 230,510 290,630" fill="#0f172a" />
  <polygon points="980,590 1050,480 1140,640" fill="#1e293b" />

  <!-- Wrecked Galleon Hull -->
  <path d="M 400,560 Q 550,520 700,550 L 680,630 Q 530,600 380,620 Z" fill="#3a2010" stroke="#1c0d04" stroke-width="4" />
  <!-- Broken Wooden Ribs -->
  <path d="M 430,555 L 420,500 M 470,550 L 460,490 M 520,545 L 510,480 M 570,542 L 560,485 M 620,545 L 610,495" stroke="#523018" stroke-width="6" stroke-linecap="round" />

  <!-- Shattered Main Mast -->
  <line x1="480" y1="580" x2="680" y2="440" stroke="#7c4a21" stroke-width="12" stroke-linecap="round" />
  <!-- Torn White Sail Canvas -->
  <polygon points="530,500 620,440 600,520" fill="#f8fafc" opacity="0.8" />

  <!-- Coastal Palm Tree -->
  <path d="M 80,675 Q 120,550 160,420" fill="none" stroke="#54381e" stroke-width="14" stroke-linecap="round" />
  <!-- Palm Fronds -->
  <path d="M 160,420 Q 90,380 30,420 M 160,420 Q 110,340 70,330 M 160,420 Q 180,330 230,340 M 160,420 Q 220,380 270,430 M 160,420 Q 170,440 220,490" fill="none" stroke="#15803d" stroke-width="8" stroke-linecap="round" />

  <!-- Title Watermark -->
  <text x="600" y="80" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="28" font-weight="bold" letter-spacing="3" opacity="0.9">ORILLA DEL NAUFRAGIO (COSTA OLVIDADA)</text>
  <text x="600" y="115" text-anchor="middle" fill="#d4af37" font-family="sans-serif" font-size="16" letter-spacing="2" opacity="0.85">CONCEPTO MAESTRO DE ENTORNO Y BIOMA INICIAL</text>
</svg>
